<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Log</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #111827;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
            padding: 24px;
        }
        h2 { margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #f3f4f6; }
        a { color: #0d6efd; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Activity Log</h2>
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Complaint</th>
                    <th>Action</th>
                    <th>Actor</th>
                    <th>Details</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                    <tr>
                        <td>{{ log.id }}</td>
                        <td>{{ log.complaint_name or 'N/A' }} - {{ log.issue or '' }}</td>
                        <td>{{ log.action }}</td>
                        <td>{{ log.actor }}</td>
                        <td>{{ log.details or '-' }}</td>
                        <td>{{ log.created_at }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
